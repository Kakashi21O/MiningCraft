[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miningcraft"
version = "0.3.0"
description = "A modular Python automation framework for Minecraft Java Edition"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "MiningCraft Contributors" }]
keywords = ["minecraft", "automation", "framework", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyCraft @ git+https://github.com/ammaraskar/pyCraft@master",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/Kakashi21O/MiningCraft"

[tool.hatch.build.targets.wheel]
packages = ["src/miningcraft"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pydantic.Field"]

[tool.ruff.lint.isort]
known-first-party = ["miningcraft"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minecraft.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
