# Standard library logging configuration (fallback for structlog).
version: 1
disable_existing_loggers: false

formatters:
  pretty:
    format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: pretty
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]
